<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aulario Plus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="tools">
  <main class="tools-main">
    <h1 id="title">Aulario Plus</h1>
    <section id="zip" hidden>
      <p id="zip-status" class="status" role="status"></p>
      <p id="zip-warning" class="notice" hidden></p>
      <progress id="zip-progress" max="1" value="0" hidden></progress>
      <div class="row">
        <button id="zip-start" class="btn primary" hidden></button>
        <button id="zip-cancel" class="btn" hidden></button>
      </div>
    </section>
    <section id="ics" hidden></section>
  </main>
  <footer class="privacy"><span data-i18n="privacy.short">🔒 Solo se conecta con MiAulario. Tus datos no salen de tu navegador.</span></footer>
  <script src="lib/core.js"></script>
  <script src="lib/store.js"></script>
  <script src="lib/api.js"></script>
  <script src="lib/i18n.js"></script>
  <script src="lib/ui.js"></script>
  <script src="lib/zip.js"></script>
  <script src="lib/due.js"></script>
  <script src="lib/ics.js"></script>
  <script src="tools.js"></script>
</body>
</html>

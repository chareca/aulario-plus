<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-brand>Aulario Plus</title>
  <link rel="stylesheet" href="popup.css">
  <script src="lib/themes.js"></script>
  <script src="boot.js"></script>
</head>
<body>
  <header class="top">
    <svg class="mak-logo" viewBox="0 0 26 26" aria-hidden="true"><rect class="lg-bg" width="26" height="26" rx="6" fill="#0b3b38"/><circle class="lg-ring" cx="13" cy="13" r="8" fill="none" stroke="#6fe0b8" stroke-width="2.6"/><circle class="lg-dot" cx="13" cy="13" r="3.6" fill="#e9fbf5"/></svg>
    <div class="head-text">
      <h1 data-brand>Aulario Plus</h1>
      <div id="status" class="status-line" role="status"><span id="headline">MiAulario</span> · <span id="subline"></span></div>
    </div>
    <button id="refresh" class="icon-btn" data-i18n-title="header.refresh" title="Actualizar los datos de las asignaturas" aria-label="Actualizar los datos de las asignaturas">↻</button>
    <button id="openTab" class="icon-btn" data-i18n-title="header.openTab" title="Abrir en una pestaña" aria-label="Abrir en una pestaña">⤢</button>
    <button id="close" class="icon-btn close" data-i18n-title="header.close" title="Cerrar" aria-label="Cerrar">✕</button>
  </header>
  <div class="searchbar"><input type="search" id="search" autocomplete="off" spellcheck="false" aria-controls="search-results"></div>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tabbtn-home" class="tab-home" data-tab="home" aria-controls="tab-home" data-i18n-title="tab.home" title="Inicio" aria-label="Inicio"></button>
    <button role="tab" id="tabbtn-due" data-tab="due" aria-controls="tab-due"><span data-i18n="tab.due">Entregas</span></button>
    <button role="tab" id="tabbtn-inbox" data-tab="inbox" aria-controls="tab-inbox"><span data-i18n="tab.inbox">Bandeja</span><span class="count-badge" id="count-inbox" hidden></span></button>
    <button role="tab" id="tabbtn-new" data-tab="new" aria-controls="tab-new"><span data-i18n="tab.new">Novedades</span><span class="count-badge" id="count-new" hidden></span></button>
    <button role="tab" id="tabbtn-grades" data-tab="grades" aria-controls="tab-grades"><span data-i18n="tab.grades">Notas</span><span class="count-badge" id="count-grades" hidden></span></button>
    <button role="tab" id="tabbtn-sites" data-tab="sites" aria-controls="tab-sites"><span data-i18n="tab.sites">Sitios</span></button>
    <button role="tab" id="tabbtn-settings" data-tab="settings" aria-controls="tab-settings"><span data-i18n="tab.settings">Ajustes</span></button>
  </nav>
  <main>
    <div id="perm" class="notice" hidden>
      <span data-i18n="perm.text">La extensión no tiene permiso para miaulario.unavarra.es y sso.unavarra.es.</span>
      <button id="grant" class="btn" data-i18n="perm.grant">Dar permiso</button>
    </div>
    <div id="whatsnew" class="whatsnew" hidden></div>
    <section id="search-results" aria-live="polite" hidden></section>
    <section id="tab-home" role="tabpanel" aria-labelledby="tabbtn-home" hidden></section>
    <section id="tab-due" role="tabpanel" aria-labelledby="tabbtn-due" hidden></section>
    <section id="tab-inbox" role="tabpanel" aria-labelledby="tabbtn-inbox" hidden></section>
    <section id="tab-new" role="tabpanel" aria-labelledby="tabbtn-new" hidden></section>
    <section id="tab-grades" role="tabpanel" aria-labelledby="tabbtn-grades" hidden></section>
    <section id="tab-sites" role="tabpanel" aria-labelledby="tabbtn-sites" hidden></section>
    <section id="tab-settings" role="tabpanel" aria-labelledby="tabbtn-settings" hidden></section>
  </main>
  <footer class="privacy"><button id="privacyLink" type="button" data-i18n="privacy.short">Solo se conecta con MiAulario. Tus datos no salen de tu navegador.</button></footer>
  <script src="lib/core.js"></script>
  <script src="lib/store.js"></script>
  <script src="lib/names.js"></script>
  <script src="lib/api.js"></script>
  <script src="lib/i18n.js"></script>
  <script src="lib/ui.js"></script>
  <script src="lib/due.js"></script>
  <script src="lib/inbox.js"></script>
  <script src="lib/news.js"></script>
  <script src="lib/grades.js"></script>
  <script src="lib/guide.js"></script>
  <script src="lib/teachers.js"></script>
  <script src="lib/send.js"></script>
  <script src="lib/search.js"></script>
  <script src="lib/help.js"></script>
  <script src="popup.js"></script>
</body>
</html>

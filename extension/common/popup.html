<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiAulario Keep-Alive</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <span id="dot" class="dot"></span>
    <div class="head-text">
      <h1 id="headline">MiAulario</h1>
      <div id="subline" class="subline"></div>
    </div>
    <button id="refresh" class="icon-btn" title="Refresh the course data" aria-label="Refresh the course data">↻</button>
    <button id="openTab" class="icon-btn" title="Open in a tab" aria-label="Open in a tab">⤢</button>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tabbtn-due" data-tab="due" aria-controls="tab-due">Due</button>
    <button role="tab" id="tabbtn-settings" data-tab="settings" aria-controls="tab-settings">Settings</button>
  </nav>
  <main>
    <div id="perm" class="notice" hidden>
      The extension does not have permission for miaulario.unavarra.es and sso.unavarra.es.
      <button id="grant" class="btn">Give permission</button>
    </div>
    <section id="tab-due" role="tabpanel" aria-labelledby="tabbtn-due" hidden></section>
    <section id="tab-settings" role="tabpanel" aria-labelledby="tabbtn-settings" hidden></section>
  </main>
  <script src="lib/core.js"></script>
  <script src="lib/store.js"></script>
  <script src="lib/ui.js"></script>
  <script src="lib/due.js"></script>
  <script src="popup.js"></script>
</body>
</html>

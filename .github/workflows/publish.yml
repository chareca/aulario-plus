name: Publish to the stores

# A published release of GitHub (tag vX.Y.Z) sends the same version to the Chrome Web Store
# and to Firefox Add-ons (AMO). Each store does its review before the users get the version.
# A store without its secrets is skipped.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release (for example v1.6.1)
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The browser tests need a Chromium browser with an extension: they run on the computer
      # of the developer before the release (tests/browser.test.js).
      - name: Run the tests
        run: node --test $(ls tests/*.test.js | grep -v '/browser\.test\.js$')

      - name: Build
        run: ./build.sh

      - name: Examine the version
        run: |
          version=$(python3 -I -c "import json; print(json.load(open('extension/manifest.chromium.json'))['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG is not the version of the manifests (v$version)."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.zip
            dist/firefox/
          if-no-files-found: error
          retention-days: 30

  chrome:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to the Chrome Web Store
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CWS_CLIENT_ID" ] || [ -z "$CWS_CLIENT_SECRET" ] || [ -z "$CWS_REFRESH_TOKEN" ] || [ -z "$CWS_PUBLISHER_ID" ] || [ -z "$CWS_EXTENSION_ID" ]; then
            echo "::notice::No secrets of the Chrome Web Store: this version is not sent to the Chrome Web Store."
            exit 0
          fi
          zip="dist/aulario-plus-chromium-$TAG.zip"
          test -f "$zip"

          token=$(curl -sS --fail-with-body https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CWS_CLIENT_ID" \
            --data-urlencode "client_secret=$CWS_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CWS_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token" | jq -r '.access_token // empty')
          if [ -z "$token" ]; then
            echo "::error::No access token from Google: examine the secrets CWS_CLIENT_ID, CWS_CLIENT_SECRET and CWS_REFRESH_TOKEN."
            exit 1
          fi
          echo "::add-mask::$token"
          item="publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID"

          upload=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $token" -T "$zip" \
            "https://chromewebstore.googleapis.com/upload/v2/$item:upload")
          echo "$upload"
          state=$(jq -r '.uploadState // empty' <<<"$upload")
          for _ in $(seq 1 30); do
            [ "$state" = "IN_PROGRESS" ] || break
            sleep 10
            status=$(curl -sS --fail-with-body -H "Authorization: Bearer $token" \
              "https://chromewebstore.googleapis.com/v2/$item:fetchStatus")
            state=$(jq -r '.lastAsyncUploadState // empty' <<<"$status")
          done
          if [ "$state" != "SUCCEEDED" ]; then
            echo "::error::The upload to the Chrome Web Store did not succeed (state: ${state:-unknown})."
            exit 1
          fi

          publish=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" -d '{"publishType":"DEFAULT_PUBLISH"}' \
            "https://chromewebstore.googleapis.com/v2/$item:publish")
          echo "$publish"
          echo "::notice::$TAG is in the review of the Chrome Web Store (state: $(jq -r '.state // "unknown"' <<<"$publish"))."

  firefox:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish to Firefox Add-ons
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::notice::No secrets of Firefox Add-ons: this version is not sent to AMO."
            exit 0
          fi
          # Listed version: AMO does the review and then signs and publishes it. The job does not wait.
          npx --yes web-ext@8 sign --source-dir dist/firefox --artifacts-dir web-ext-artifacts \
            --channel listed --approval-timeout 0
          echo "::notice::$TAG is in the review of Firefox Add-ons."

name: Publish to the stores

# A published release of GitHub (tag vX.Y.Z) sends the same version to the Chrome Web Store
# and to Firefox Add-ons (AMO). Each store does its review before the users get the version.
# AMO is paused: see the job "firefox".
# A store without its secrets is skipped. To examine the keys without an upload, run the
# workflow by hand with "check". The keys are secrets of the environment "stores": only the branch
# main and the tags v* reach it. The actions are pinned to a commit (Dependabot updates them).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release (for example v1.6.2). Not necessary with "check".
        required: false
      check:
        description: Only examine the keys of the stores (no build, no upload)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  check:
    if: ${{ inputs.check }}
    runs-on: ubuntu-latest
    environment: stores
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Examine the keys of the Chrome Web Store
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: scripts/cws.sh check

      - name: Examine the keys of Firefox Add-ons
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          if [ -z "$AMO_API_KEY" ] || [ -z "$AMO_API_SECRET" ]; then
            echo "::notice::No secrets of Firefox Add-ons."
            exit 0
          fi
          # A request with a JWT (HS256), as web-ext does. The answer is not shown: it has the profile.
          node -e '
            const crypto = require("node:crypto");
            const part = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
            const now = Math.floor(Date.now() / 1000);
            const head = part({ alg: "HS256", typ: "JWT" });
            const body = part({ iss: process.env.AMO_API_KEY, jti: crypto.randomUUID(), iat: now, exp: now + 60 });
            const sign = crypto.createHmac("sha256", process.env.AMO_API_SECRET).update(head + "." + body).digest("base64url");
            fetch("https://addons.mozilla.org/api/v5/accounts/profile/", { headers: { Authorization: `JWT ${head}.${body}.${sign}` } })
              .then((r) => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                console.log("::notice::The keys of Firefox Add-ons work.");
              })
              .catch((e) => {
                console.log(`::error::The keys of Firefox Add-ons do not work (${e.message}).`);
                process.exitCode = 1;
              });
          '

  build:
    if: ${{ !inputs.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Examine the tag
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag is not of the form vX.Y.Z."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      # The commit of the tag: the job "chrome" uses the same one, also if the tag changes meanwhile.
      - name: The commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The browser tests need a Chromium browser with an extension: they run on the computer
      # of the developer before the release (tests/browser.test.js).
      - name: Run the tests
        run: node --test $(ls tests/*.test.js | grep -v '/browser\.test\.js$')

      - name: Build
        run: ./build.sh

      - name: Examine the version
        run: |
          version=$(python3 -I -c "import json; print(json.load(open('extension/manifest.chromium.json'))['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG is not the version of the manifests (v$version)."
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: |
            dist/*.zip
            dist/firefox/
          if-no-files-found: error
          retention-days: 30

  chrome:
    needs: build
    runs-on: ubuntu-latest
    environment: stores
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Publish to the Chrome Web Store
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: scripts/cws.sh publish "dist/aulario-plus-chromium-$TAG.zip"

  firefox:
    # Paused (2026-10-21): no new version to AMO until it accepts the first one. To send them again, remove this line.
    if: false
    needs: build
    runs-on: ubuntu-latest
    environment: stores
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # In a step without the keys, and without the install scripts of the packages. An exact version: a new
      # release of web-ext does not run here unseen.
      - name: Install web-ext
        run: npm install --global --ignore-scripts web-ext@8.10.0

      - name: Publish to Firefox Add-ons
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::notice::No secrets of Firefox Add-ons: this version is not sent to AMO."
            exit 0
          fi
          # Listed version: AMO does the review and then signs and publishes it. The job does not wait.
          web-ext sign --source-dir dist/firefox --artifacts-dir web-ext-artifacts \
            --channel listed --approval-timeout 0
          echo "::notice::$TAG is in the review of Firefox Add-ons."
